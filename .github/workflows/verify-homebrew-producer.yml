name: Disposable Homebrew Producer Rehearsal

on:
  pull_request:

permissions: {}

jobs:
  tap-publish:
    name: Open valid tap pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      MISE_EXEC_AUTO_INSTALL: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          filter: 'blob:none'
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          install_args: go
          cache: true
          add_shims_to_path: false
          export_path: false

      - name: Build release CLI
        shell: bash
        run: mise exec -- go build -o release-cli ./cmd/release-cli

      - name: Create tap app token
        id: tap-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MEIGMA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MEIGMA_RELEASE_APP_PRIVATE_KEY }}
          owner: meigma
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Prepare released cask
        shell: bash
        run: |
          mkdir -p dist/homebrew/Casks
          cat >dist/homebrew/Casks/meigma-release-cli.rb <<'RUBY'
          cask "meigma-release-cli" do
            version "0.1.3"

            on_macos do
              on_arm do
                sha256 "f9ac64eb1b1191d58176216c4e9ccffe0cfce0ea39f219e9c65a429dcf5b2aaa"
                url "https://github.com/meigma/release/releases/download/v0.1.3/release-cli_#{version}_darwin_arm64.tar.gz"
              end
              on_intel do
                sha256 "5709c1fbf62ee121dfdf91d92a3c7ce5c4aaa566ee15a530067c6f161e7fc7a6"
                url "https://github.com/meigma/release/releases/download/v0.1.3/release-cli_#{version}_darwin_amd64.tar.gz"
              end
            end
            on_linux do
              on_arm do
                sha256 "f45226f291519ae4e34fec9ab5ac0e4501225aad92ee3bdaa1f5d2f5c889059b"
                url "https://github.com/meigma/release/releases/download/v0.1.3/release-cli_#{version}_linux_arm64.tar.gz"
              end
              on_intel do
                sha256 "8d6cd431d18dc9e52f845bb096947f666e10a568f41873aa7e463e0e83920d0b"
                url "https://github.com/meigma/release/releases/download/v0.1.3/release-cli_#{version}_linux_amd64.tar.gz"
              end
            end

            name "meigma-release-cli"
            desc "Release automation for Meigma projects"
            homepage "https://github.com/meigma/release"

            livecheck do
              skip "Disposable producer rehearsal."
            end

            binary "release-cli"
          end
          RUBY

      - name: Publish cask through tap pull request
        shell: bash
        env:
          RELEASE_APP_TOKEN: ${{ steps.tap-app.outputs.token }}
        run: |
          GITHUB_REF_NAME=v0.1.3 \
          GITHUB_SHA=0fc99489d31d400bc3f69d6636d60e7d3f3d0251 \
            ./release-cli publish homebrew \
              --dist dist \
              --tap meigma/homebrew-tap \
              --cask meigma-release-cli \
              --json

  notarize-success:
    name: Notarize both Darwin binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      MACOS_NOTARIZE_ENABLED: 'true'
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MISE_EXEC_AUTO_INSTALL: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: 'blob:none'
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          install_args: >-
            go
            aqua:goreleaser/goreleaser
            aqua:anchore/syft
          cache: true
          add_shims_to_path: false
          export_path: false

      - name: Build signed and notarized snapshot
        shell: bash
        run: mise exec -- goreleaser release --snapshot --clean --skip=sign

      - name: Upload notarized Darwin archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notarized-darwin
          path: |
            dist/*_darwin_amd64.tar.gz
            dist/*_darwin_arm64.tar.gz
            dist/homebrew/Casks/meigma-release-cli.rb
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  signing-disabled:
    name: Preserve credential-free build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      MACOS_NOTARIZE_ENABLED: 'false'
      MISE_EXEC_AUTO_INSTALL: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: 'blob:none'
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          install_args: >-
            go
            aqua:goreleaser/goreleaser
            aqua:anchore/syft
          cache: true
          add_shims_to_path: false
          export_path: false

      - name: Build without Apple credentials
        shell: bash
        run: mise exec -- goreleaser release --snapshot --clean --skip=sign

  apple-rejection:
    name: Reject invalid Apple key
    needs: notarize-success
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      MACOS_NOTARIZE_ENABLED: 'true'
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: AAAAAAAAAA
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MISE_EXEC_AUTO_INSTALL: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: 'blob:none'
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          install_args: >-
            go
            aqua:goreleaser/goreleaser
            aqua:anchore/syft
          cache: true
          add_shims_to_path: false
          export_path: false

      - name: Require Apple rejection before archiving
        shell: bash
        run: |
          set -euo pipefail
          if mise exec -- goreleaser release --snapshot --clean --skip=sign; then
            echo '::error::Invalid Apple credentials unexpectedly produced a release.'
            exit 1
          fi
          if compgen -G 'dist/*.tar.gz' >/dev/null; then
            echo '::error::Apple rejection occurred after release archives were written.'
            exit 1
          fi
