name: Reusable Go GitHub Release Publisher

on:
  workflow_call:
    inputs:
      artifact-id:
        description: ID of the authoritative release-assets artifact.
        required: true
        type: string
      artifact-digest:
        description: Expected SHA-256 digest of the release-assets artifact.
        required: true
        type: string
      release-app-client-id:
        description: Client ID of the GitHub App that publishes releases.
        required: true
        type: string
      publish-release:
        description: Publish the draft after uploading and attesting its assets.
        required: false
        default: true
        type: boolean
    secrets:
      release-app-private-key:
        description: Private key of the GitHub App that publishes releases.
        required: true
    outputs:
      attestation-url:
        description: URL of the GitHub build-provenance attestation.
        value: ${{ jobs.publish.outputs.attestation-url }}
      release-url:
        description: URL of the populated GitHub Release.
        value: ${{ jobs.publish.outputs.release-url }}

permissions: {}

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      attestation-url: ${{ steps.attest.outputs.attestation-url }}
      release-url: ${{ steps.release.outputs.url }}
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      MISE_EXEC_AUTO_INSTALL: 'false'
    steps:
      - name: Require a tag ref
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != 'tag' ]]; then
            echo '::error::GitHub Release publication must run against a tag ref.'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: 'blob:none'
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          install_args: 'aqua:cli/cli aqua:sigstore/cosign'
          cache: true
          add_shims_to_path: false
          export_path: false

      - name: Verify publication tools
        shell: bash
        run: |
          mise exec -- bash -euo pipefail -c '
            for tool in gh cosign; do
              active=$(command -v "${tool}")
              managed=$(mise which "${tool}")
              test "$(realpath "${active}")" = "$(realpath "${managed}")"
              printf "Using %s: %s\n" "${tool}" "${active}"
            done
            gh --version
            cosign version
          '

      - name: Create release app token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.release-app-client-id }}
          private-key: ${{ secrets.release-app-private-key }}
          permission-contents: write

      - name: Verify artifact handoff
        env:
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          EXPECTED_DIGEST: ${{ inputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          actual_digest=$(mise exec -- gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            --jq '.digest')
          if [[ "${actual_digest#sha256:}" != "${EXPECTED_DIGEST#sha256:}" ]]; then
            echo "::error::Artifact digest mismatch: expected ${EXPECTED_DIGEST}, got ${actual_digest}."
            exit 1
          fi

      - name: Wait for matching draft release
        id: draft
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        shell: bash
        run: |
          release=''
          for attempt in {1..24}; do
            if release=$(
              mise exec -- gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/releases?per_page=100" 2>/dev/null |
                jq -ce --arg tag "${GITHUB_REF_NAME}" \
                  '[.[][] | select(.tag_name == $tag)] | first // empty'
            ); then
              break
            fi
            printf 'Draft release not available; retrying (%s/24).\n' "${attempt}"
            sleep 5
          done

          if [[ -z "${release}" ]]; then
            echo "::error::No GitHub Release found for ${GITHUB_REF_NAME}."
            exit 1
          fi

          if [[ "$(jq -r '.draft' <<<"${release}")" != 'true' ]]; then
            echo "::error::Release ${GITHUB_REF_NAME} is not a draft."
            exit 1
          fi
          if [[ "$(jq -r '.tag_name' <<<"${release}")" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::Draft release tag does not match ${GITHUB_REF_NAME}."
            exit 1
          fi
          if [[ "$(jq '.assets | length' <<<"${release}")" != '0' ]]; then
            echo "::error::Draft release already contains assets; refusing to replace them."
            exit 1
          fi

          tag_commit=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag resolves to ${tag_commit}, expected ${GITHUB_SHA}."
            exit 1
          fi

          printf 'id=%s\n' "$(jq -r '.id' <<<"${release}")" >>"${GITHUB_OUTPUT}"

      - name: Download authoritative release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: dist
          digest-mismatch: error

      - name: Verify authoritative release assets
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/go-pre-publish.yml@${{ github.ref }}
        shell: bash
        run: |
          mise exec -- bash -euo pipefail -c '
            cd dist
            sha256sum --check checksums.txt
            cosign verify-blob \
              --bundle checksums.txt.sigstore.json \
              --certificate-identity "${CERTIFICATE_IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              checksums.txt
          '

      - name: Attest release assets
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
          )
          if (( ${#assets[@]} == 0 )); then
            echo '::error::No release assets found.'
            exit 1
          fi
          mise exec -- gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}"

      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        shell: bash
        run: |
          release_assets=$(mise exec -- gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100")

          expected_count=2
          while read -r checksum name; do
            expected_count=$((expected_count + 1))
            actual=$(jq -r --arg name "${name}" \
              '.[] | select(.name == $name) | .digest' <<<"${release_assets}")
            if [[ "${actual}" != "sha256:${checksum}" ]]; then
              echo "::error::Release asset ${name} has digest ${actual}, expected sha256:${checksum}."
              exit 1
            fi
          done <dist/checksums.txt

          for name in checksums.txt checksums.txt.sigstore.json; do
            expected="sha256:$(sha256sum "dist/${name}" | cut -d' ' -f1)"
            actual=$(jq -r --arg name "${name}" \
              '.[] | select(.name == $name) | .digest' <<<"${release_assets}")
            if [[ "${actual}" != "${expected}" ]]; then
              echo "::error::Release asset ${name} has digest ${actual}, expected ${expected}."
              exit 1
            fi
          done

          actual_count=$(jq 'length' <<<"${release_assets}")
          if (( actual_count != expected_count )); then
            echo "::error::Release contains ${actual_count} assets; expected ${expected_count}."
            exit 1
          fi

      - name: Finalize release
        id: release
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          PUBLISH_RELEASE: ${{ inputs.publish-release }}
        shell: bash
        run: |
          if [[ "${PUBLISH_RELEASE}" == 'true' ]]; then
            mise exec -- gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false \
              --verify-tag
          fi

          release=$(mise exec -- gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,url)
          expected_draft='true'
          if [[ "${PUBLISH_RELEASE}" == 'true' ]]; then
            expected_draft='false'
          fi
          if [[ "$(jq -r '.isDraft' <<<"${release}")" != "${expected_draft}" ]]; then
            echo '::error::GitHub Release ended in the wrong draft state.'
            exit 1
          fi
          printf 'url=%s\n' "$(jq -r '.url' <<<"${release}")" >>"${GITHUB_OUTPUT}"
