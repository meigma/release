name: Reusable Go Pre-publish

on:
  workflow_call:
    outputs:
      artifact-id:
        description: ID of the authoritative release-assets artifact.
        value: ${{ jobs.release-assets.outputs.artifact-id }}
      artifact-url:
        description: URL of the authoritative release-assets artifact.
        value: ${{ jobs.release-assets.outputs.artifact-url }}
      artifact-digest:
        description: SHA-256 digest of the authoritative release-assets artifact.
        value: ${{ jobs.release-assets.outputs.artifact-digest }}

permissions: {}

jobs:
  release-assets:
    name: Build authoritative release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    permissions:
      contents: read
      id-token: write
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Require a tag ref
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != 'tag' ]]; then
            echo '::error::Go pre-publish must run against a tag ref.'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: 'blob:none'
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          install_args: go
          cache: true
          add_shims_to_path: false
          export_path: false

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: v3.1.3

      - name: Build and sign release assets
        shell: bash
        run: |
          mise x aqua:goreleaser/goreleaser@2.17.1 -- bash -euo pipefail -c '
            mise_go=$(mise which go)
            active_go=$(command -v go)
            test "$(realpath "${active_go}")" = "$(realpath "${mise_go}")"
            printf "Using %s\n" "${active_go}"
            go version
            goreleaser release --clean --skip=publish
          '

      - name: Verify release asset checksums
        working-directory: dist
        shell: bash
        run: |
          sha256sum --check checksums.txt
          test -s checksums.txt.sigstore.json

      - name: Upload authoritative release assets
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
