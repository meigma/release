name: Spike cached local release-cli

on:
  pull_request:
    paths:
      - .github/actions/setup-release-cli/action.yml
      - .github/workflows/spike-local-cli-job.yml
      - .github/workflows/spike-local-cli.yml

permissions: {}

jobs:
  first:
    name: First local build
    permissions:
      contents: read
    uses: ./.github/workflows/spike-local-cli-job.yml

  second:
    name: Second local build
    needs: first
    permissions:
      contents: read
    uses: ./.github/workflows/spike-local-cli-job.yml

  third:
    name: Third local build
    needs: second
    permissions:
      contents: read
    uses: ./.github/workflows/spike-local-cli-job.yml

  fourth:
    name: Fourth local build
    needs: third
    permissions:
      contents: read
    uses: ./.github/workflows/spike-local-cli-job.yml

  verify:
    name: Verify cache and binary identity
    needs:
      - first
      - second
      - third
      - fourth
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require cache reuse and identical binaries
        shell: bash
        env:
          FIRST_CACHE_HIT: ${{ needs.first.outputs.cache-hit }}
          FIRST_SHA256: ${{ needs.first.outputs.binary-sha256 }}
          FOURTH_CACHE_HIT: ${{ needs.fourth.outputs.cache-hit }}
          FOURTH_SHA256: ${{ needs.fourth.outputs.binary-sha256 }}
          SECOND_CACHE_HIT: ${{ needs.second.outputs.cache-hit }}
          SECOND_SHA256: ${{ needs.second.outputs.binary-sha256 }}
          THIRD_CACHE_HIT: ${{ needs.third.outputs.cache-hit }}
          THIRD_SHA256: ${{ needs.third.outputs.binary-sha256 }}
        run: |
          set -euo pipefail

          test "${SECOND_CACHE_HIT}" = 'true'
          test "${THIRD_CACHE_HIT}" = 'true'
          test "${FOURTH_CACHE_HIT}" = 'true'

          test "${FIRST_SHA256}" = "${SECOND_SHA256}"
          test "${FIRST_SHA256}" = "${THIRD_SHA256}"
          test "${FIRST_SHA256}" = "${FOURTH_SHA256}"

          printf 'cache-hits first=%s second=%s third=%s fourth=%s\n' \
            "${FIRST_CACHE_HIT:-false}" \
            "${SECOND_CACHE_HIT}" \
            "${THIRD_CACHE_HIT}" \
            "${FOURTH_CACHE_HIT}"
          printf 'identical-sha256=%s\n' "${FIRST_SHA256}"
